# 【要確認】とある項目は、実機で確認して値を決めること。

servo_node:
  ros__parameters:
    # --- 首振りの波形 ---
    amplitude_deg: 15.0        # 振幅 [度]。±15度
    max_amplitude_deg: 30.0    # 安全のための上限
    period_sec: 3.0            # 1往復の時間 [秒]。3秒だと片道の角速度は毎秒約20度
    smoothness: 0.3            # 0=三角波, 1=正弦波 (折り返しのなめらかさ)
    update_rate_hz: 100.0      # 指令とTFの更新周期 (50Hz以上)

    # --- 補正 (実機で調整) ---
    angle_scale: 1.0           # 推定角度 = angle_scale * 指令角度
    time_offset: 0.0           # スタンプ = 指令時刻 + time_offset [秒]。サーボの遅れ τ を正の値で入れる

    # --- 出力 ---
    topic: /servo_state        # sensor_msgs/JointState, position[0] はラジアン
    joint_name: nodding_joint
    parent_frame: servo_link
    child_frame: lidar_link
    lidar_height: 0.04505      # 回転軸からLiDARのセンサ原点までの高さ [m]
    publish_tf: true

    # --- サーボ / PCA9685 ---
    use_hardware: true         # false にすると、サーボなしで角度とTFだけ出す
    i2c_bus: 1                 # 【要確認】Orin Nanoの接続先バス番号 (/dev/i2c-N)
    i2c_address: 64            # 0x40。【要確認】
    channel: 0
    pwm_freq_hz: 50.0
    osc_hz: 25000000.0         # PCA9685の発振周波数。周期がずれる場合に調整
    servo_center_us: 1500.0    # 【要確認】サーボが水平(角度0)になるパルス幅
    servo_us_per_deg: 11.11    # 【要確認】1度あたりのパルス幅。サーボの型番で異なる
    servo_sign: 1.0            # 正の角度で前方が下がるように、1.0 か -1.0 にする
    min_pulse_us: 1000.0       # 安全のためのパルス幅の下限・上限
    max_pulse_us: 2000.0

scan_to_cloud:
  ros__parameters:
    scan_topic: /scan
    cloud_topic: /points
    output_frame: servo_link   # IMUに対して固定のフレーム。base_link にする場合は、base_link->servo_link のTFが必要
    lidar_frame: ""            # 空なら /scan の frame_id を使う

    frames_per_cloud: 4        # 何回転分を1フレームにまとめるか
    tf_samples_per_scan: 8     # 1回転の中でTFを取得する区間数
    tf_timeout: 0.1            # TFの到着を待つ上限 [秒]
    tf_cache_sec: 5.0          # TFの保持時間 [秒]

    default_scan_time: 0.0667  # /scan の scan_time が0のときの代用値 [秒]
    stamp_is_scan_end: false   # 【要確認】/scan の header.stamp が1回転の終了時刻なら true
    reverse_time_order: false  # 【要確認】配列の向きと時刻の進む向きが逆なら true
    max_frame_duration: 0.5    # フレームが途切れたと判断する時間 [秒]
    reliable_output: true
